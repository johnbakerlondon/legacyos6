name: Build PixelSiege .deb

on:
  push:
    paths:
      - 'PixelSiege-iOS6-Universal/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Clone Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Show available SDKs
        run: xcodebuild -showsdks

      - name: Build PixelSiege
        run: |
          cd PixelSiege-iOS6-Universal
          chmod +x build.sh
          ./build.sh

      - name: Copy .deb to debs folder
        run: |
          mkdir -p debs
          cp PixelSiege-iOS6-Universal/dist/*.deb debs/

      - name: Commit and push .deb
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add debs/
          git commit -m "Add compiled PixelSiege .deb" || echo "No changes"
          git push
